name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Codebase & Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint 9 validation
        run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Verify clean in-memory migrations (0001 -> 0010)
        run: npx tsx scripts/migrate.ts --memory

      - name: Verify persistent migrations
        run: npm run db:migrate

      - name: Verify deterministic seed
        run: npm run db:seed

      - name: Production application build
        run: npm run build
